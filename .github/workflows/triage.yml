name: PR Triage Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issues:
    types: [opened, reopened]
  schedule:
    - cron: '0 9 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run mode'
        required: false
        default: 'true'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  single-item-triage:
    name: Triage New Item
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'issues'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install \
            PyGithub \
            click \
            httpx \
            pydantic \
            pydantic-settings \
            PyYAML \
            rich \
            openai \
            python-dotenv \
            tiktoken \
            scikit-learn \
            numpy \
            jinja2 \
            tenacity \
            structlog \
            ollama

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.ai/install.sh | sh
          ollama serve &
          echo "Waiting for Ollama..."
          sleep 20
          ollama pull llama3.2 || true
          sleep 30
        continue-on-error: true

      - name: Triage PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m src.cli.main analyze-pr \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --provider ollama \
            --model llama3.2 \
            --dry-run
        continue-on-error: true

      - name: Triage Issue
        if: github.event_name == 'issues'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m src.cli.main triage \
            --repo "${{ github.repository }}" \
            --max-prs 0 \
            --max-issues 5 \
            --provider ollama \
            --dry-run
        continue-on-error: true

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7

  daily-triage:
    name: Daily Full Triage
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install \
            PyGithub \
            click \
            httpx \
            pydantic \
            pydantic-settings \
            PyYAML \
            rich \
            openai \
            python-dotenv \
            tiktoken \
            scikit-learn \
            numpy \
            jinja2 \
            tenacity \
            structlog \
            ollama

      - name: Setup Ollama
        run: |
          curl -fsSL https://ollama.ai/install.sh | sh
          ollama serve &
          sleep 20
          ollama pull llama3.2 || true
          sleep 30
        continue-on-error: true

      - name: Run Full Triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m src.cli.main triage \
            --repo "${{ github.repository }}" \
            --max-prs 50 \
            --max-issues 100 \
            --provider ollama \
            --output markdown \
            --dry-run
        continue-on-error: true

      - name: Upload Digest
        uses: actions/upload-artifact@v4
        with:
          name: triage-digest-${{ github.run_number }}
          path: triage-digest-*.md
          retention-days: 30

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7